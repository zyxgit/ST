# =============================================================================
# ST 微服务 Production 部署（Docker Compose）
# 前置条件：
#   1) 登录 GHCR：  echo $GITHUB_TOKEN | docker login ghcr.io -u <用户名> --password-stdin
#   2) 先执行迁移： .\deploy-production.ps1 -MigrateOnly
#   3) 再启动服务： .\deploy-production.ps1
# =============================================================================

services:
  # ========================
  # 基础设施
  # ========================
  postgres:
    image: docker.io/library/postgres:17.6
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - st-prod
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: docker.io/library/redis:8.6
    command: ["redis-server", "--requirepass", "${PASSWORD}", "--save", "60", "1"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - st-prod
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: docker.io/library/rabbitmq:4.2-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITUSER}
      RABBITMQ_DEFAULT_PASS: ${RABBITPASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - st-prod
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Aspire Dashboard（OpenTelemetry 链路/指标/日志）
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest
    ports:
      - "127.0.0.1:18888:18888"
    expose:
      - "18889"
    networks:
      - st-prod
    restart: always

  # ========================
  # 微服务
  # ========================
  st-gateway:
    image: ghcr.io/zyxgit/st/gateway:${IMAGE_TAG}
    ports:
      - "0.0.0.0:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: st-gateway
      DownstreamServices__Identity__Address: http://st-ms-identity-api:8080
      DownstreamServices__OperationLog__Address: http://st-ms-operationlog-api:8080
      DownstreamServices__Test__Address: http://st-ms-test-api:8080
      DownstreamServices__FileUpload__Address: http://st-ms-fileupload-api:8080
      ForwardedHeaders__TrustAll: "true"
    depends_on:
      - st-ms-identity-api
      - st-ms-operationlog-api
      - st-ms-test-api
      - st-ms-fileupload-api
    networks:
      - st-prod
    restart: always

  st-ms-identity-api:
    image: ghcr.io/zyxgit/st/identity-api:${IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_identity
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: st-ms-identity-api
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - st-prod
    restart: always

  st-ms-test-api:
    image: ghcr.io/zyxgit/st/test-api:${IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_test
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: st-ms-test-api
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - st-prod
    restart: always

  st-ms-fileupload-api:
    image: ghcr.io/zyxgit/st/fileupload-api:${IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_fileupload
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: st-ms-fileupload-api
    volumes:
      - fileupload-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - st-prod
    restart: always

  st-ms-operationlog-api:
    image: ghcr.io/zyxgit/st/operationlog-api:${IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_operationlog
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: st-ms-operationlog-api
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - st-prod
    restart: always

  st-ms-operationlog-consumer:
    image: ghcr.io/zyxgit/st/operationlog-consumer:${IMAGE_TAG}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_operationlog
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: st-ms-operationlog-consumer
    depends_on:
      postgres:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - st-prod
    restart: always

  # ========================
  # 迁移服务（--profile migrate 触发）
  # ========================
  migrate-identity:
    image: ghcr.io/zyxgit/st/identity-api:${IMAGE_TAG}
    profiles: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_identity
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "true"
      App__IsCreateDatabase: "true"
      App__IsDataSeed: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: migrate-identity
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - st-prod

  migrate-test:
    image: ghcr.io/zyxgit/st/test-api:${IMAGE_TAG}
    profiles: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_test
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "true"
      App__IsCreateDatabase: "true"
      App__IsDataSeed: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: migrate-test
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
      rabbitmq:
        condition: service_started
    networks:
      - st-prod

  migrate-fileupload:
    image: ghcr.io/zyxgit/st/fileupload-api:${IMAGE_TAG}
    profiles: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_fileupload
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      App__IsCodeFirst: "true"
      App__IsCreateDatabase: "true"
      App__IsDataSeed: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: migrate-fileupload
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - st-prod

  migrate-operationlog:
    image: ghcr.io/zyxgit/st/operationlog-api:${IMAGE_TAG}
    profiles: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      HTTP_PORTS: "8080"
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_operationlog
      ConnectionStrings__cache: cache:6379,password=${PASSWORD}
      App__IsCodeFirst: "true"
      App__IsCreateDatabase: "true"
      App__IsDataSeed: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://aspire-dashboard:18889
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: migrate-operationlog
    depends_on:
      postgres:
        condition: service_started
      cache:
        condition: service_started
    networks:
      - st-prod

networks:
  st-prod:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  fileupload-uploads:

    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  st.aspire.apphost-9ba2078f19-cache-data:
    driver: "local"
  st.aspire.apphost-9ba2078f19-postgres-data:
    driver: "local"
  st.aspire.apphost-9ba2078f19-rabbitmq-data:
    driver: "local"

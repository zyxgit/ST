  st-ms-operationlog-consumer:
    image: "${ST_MS_OPERATIONLOG_CONSUMER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__Default: "Host=postgres;Port=5432;Username=${PGUSER};Password=${PASSWORD};Database=st_operationlog"
      DEFAULT_HOST: "postgres"
      DEFAULT_PORT: "5432"
      DEFAULT_USERNAME: "${PGUSER}"
      DEFAULT_PASSWORD: "${PASSWORD}"
      DEFAULT_URI: "postgresql://${PGUSER}:${PASSWORD}@postgres:5432/st_operationlog"
      DEFAULT_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/st_operationlog"
      DEFAULT_DATABASENAME: "st_operationlog"
      ConnectionStrings__rabbitmq: "amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672"
      RABBITMQ_HOST: "rabbitmq"
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: "${RABBITUSER}"
      RABBITMQ_PASSWORD: "${RABBITPASSWORD}"
      RABBITMQ_URI: "amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "st-ms-operationlog-consumer"
    depends_on:
      postgres:
        condition: "service_started"
      rabbitmq:

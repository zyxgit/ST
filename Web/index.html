<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST Admin</title>
    <style>
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        gap: 24px;
        background: #f1f5f9;
        font-family: 'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
      }
      .app-loading__brand {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: 2px;
        background: linear-gradient(90deg,#18a058,#34d399,#18a058,#34d399);
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: brand-shimmer 3s ease-in-out infinite;
      }
      @keyframes brand-shimmer {
        0%,100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
      }
      .app-loading__spinner {
        position: relative;
        width: 56px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-loading__spinner::after {
        content: '';
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        background: conic-gradient(from 0deg,transparent 0%,rgba(24,160,88,0.12),rgba(52,211,153,0.12),transparent 80%);
        animation: app-loading-spin 3s linear infinite;
        filter: blur(16px);
      }
      .app-loading__ring {
        position: absolute;
        border-radius: 50%;
      }
      .app-loading__ring--outer {
        inset: 0;
        background: conic-gradient(from 0deg,#18a058,#34d399,#0d9488,#18a058);
        mask: radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 3px));
        -webkit-mask: radial-gradient(farthest-side,transparent calc(100% - 3px),#fff calc(100% - 3px));
        animation: app-loading-spin .8s linear infinite;
        box-shadow: 0 0 12px rgba(24,160,88,0.2);
      }
      .app-loading__ring--inner {
        inset: 8px;
        background: conic-gradient(from 180deg,#0d9488,#2dd4bf,transparent 60%);
        mask: radial-gradient(farthest-side,transparent calc(100% - 2px),#fff calc(100% - 2px));
        -webkit-mask: radial-gradient(farthest-side,transparent calc(100% - 2px),#fff calc(100% - 2px));
        animation: app-loading-spin 1.5s linear infinite reverse;
        opacity: .7;
      }
      .app-loading__core {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #18a058;
        animation: core-pulse 1.5s ease-in-out infinite;
        box-shadow: 0 0 8px rgba(24,160,88,0.6);
        z-index: 1;
      }
      @keyframes core-pulse {
        0%,100% { transform: scale(1); opacity: .8; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      @keyframes app-loading-spin {
        to { transform: rotate(360deg); }
      }
      .app-loading__text {
        font-size: 14px;
        color: #64748b;
        animation: text-pulse 2s ease-in-out infinite;
      }
      @keyframes text-pulse {
        0%,100% { opacity: .5; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading__brand">ST Admin</div>
        <div class="app-loading__spinner">
          <div class="app-loading__ring app-loading__ring--outer"></div>
          <div class="app-loading__ring app-loading__ring--inner"></div>
          <div class="app-loading__core"></div>
        </div>
        <div class="app-loading__text">正在加载...</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# Loki 单实例配置 — 日志存储（文件系统）
# 生产部署建议用 S3/GCS 替代 filesystem 并开启 replication_factor > 1
---
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  instance_addr: 0.0.0.0
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_samples_over_max_age: false
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20

compactor:
  working_directory: /loki/compactor
  retention_enabled: true

retention:
  retention_period: 168h  # 7 天，按需调整

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

# 二阶段 Prometheus / Tempo 预留：

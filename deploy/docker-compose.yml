services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-25432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - st-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    command:
      - --requirepass
      - ${REDIS_PASSWORD}
      - --save
      - "60"
      - "1"
    ports:
      - "${REDIS_HOST_PORT:-26379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - st-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITUSER}
      RABBITMQ_DEFAULT_PASS: ${RABBITPASSWORD}
    ports:
      - "${RABBITMQ_AMQP_HOST_PORT:-25672}:5672"
      - "${RABBITMQ_MGMT_HOST_PORT:-25673}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - st-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ──────────────────────────────────────────────
  # Observability – 日志 + 指标链路
  # ──────────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.8.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      ALLOY_DISABLE_TELEMETRY: "true"
    ports:
      - "${ALLOY_OTLP_GRPC_PORT:-24317}:4317"   # OTLP gRPC
      - "${ALLOY_OTLP_HTTP_PORT:-24318}:4318"   # OTLP HTTP
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
    networks:
      - st-network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  loki:
    image: grafana/loki:3.4.2
    ports:
      - "${LOKI_HOST_PORT:-23100}:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - st-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.3.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=otlp-write-receiver
    ports:
      - "${PROMETHEUS_HOST_PORT:-29090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - st-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: ""
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_HOST_PORT:-23000}:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - st-network
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started

  # ──────────────────────────────────────────────
  # Backend Microservices
  # ──────────────────────────────────────────────
  st-ms-identity-api:
    image: ghcr.io/zyxgit/st/st-ms-identity-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_identity
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "${APP_IS_DATA_SEED:-false}"
      Jwt__SigningKey: ${JWTSIGNINGKEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-identity-api
    ports:
      - "${IDENTITY_HOST_PORT:-27127}:8080"
    volumes:
      - identity-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  st-ms-operationlog-api:
    image: ghcr.io/zyxgit/st/st-ms-operationlog-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_operationlog
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-operationlog-api
    ports:
      - "${OPERATIONLOG_HOST_PORT:-21001}:8080"
    volumes:
      - operationlog-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  st-ms-operationlog-consumer:
    image: ghcr.io/zyxgit/st/st-ms-operationlog-consumer:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_operationlog
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-operationlog-consumer
    volumes:
      - operationlog-consumer-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  st-ms-fileupload-api:
    image: ghcr.io/zyxgit/st/st-ms-fileupload-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_fileupload
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "${APP_IS_DATA_SEED:-false}"
      FileStorage__Type: Local
      FileStorage__UploadRoot: /app/uploads
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-fileupload-api
    ports:
      - "${FILEUPLOAD_HOST_PORT:-27250}:8080"
    volumes:
      - fileupload-logs:/app/logs
      - fileupload-uploads:/app/uploads
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  st-ms-test-api:
    image: ghcr.io/zyxgit/st/st-ms-test-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_test
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "${APP_IS_DATA_SEED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-test-api
    ports:
      - "${TEST_HOST_PORT:-25089}:8080"
    volumes:
      - test-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  st-ms-order-api:
    image: ghcr.io/zyxgit/st/st-ms-order-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_order
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "${APP_IS_DATA_SEED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-order-api
    ports:
      - "${ORDER_HOST_PORT:-25090}:8080"
    volumes:
      - order-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  st-ms-inventory-api:
    image: ghcr.io/zyxgit/st/st-ms-inventory-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_inventory
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "${APP_IS_DATA_SEED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-inventory-api
    ports:
      - "${INVENTORY_HOST_PORT:-25091}:8080"
    volumes:
      - inventory-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  st-ms-payment-api:
    image: ghcr.io/zyxgit/st/st-ms-payment-api:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      ConnectionStrings__Default: Host=postgres;Port=5432;Username=${PGUSER};Password=${PGPASSWORD};Database=st_payment
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD}
      ConnectionStrings__rabbitmq: amqp://${RABBITUSER}:${RABBITPASSWORD}@rabbitmq:5672
      App__IsCodeFirst: "false"
      App__IsCreateDatabase: "false"
      App__IsDataSeed: "${APP_IS_DATA_SEED:-false}"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-ms-payment-api
    ports:
      - "${PAYMENT_HOST_PORT:-25092}:8080"
    volumes:
      - payment-logs:/app/logs
    networks:
      - st-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  st-gateway:
    image: ghcr.io/zyxgit/st/st-gateway:latest
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      HTTP_PORTS: 8080
      DownstreamServices__Identity__Address: http://st-ms-identity-api:8080
      DownstreamServices__OperationLog__Address: http://st-ms-operationlog-api:8080
      DownstreamServices__Test__Address: http://st-ms-test-api:8080
      DownstreamServices__FileUpload__Address: http://st-ms-fileupload-api:8080
      DownstreamServices__Order__Address: http://st-ms-order-api:8080
      DownstreamServices__Inventory__Address: http://st-ms-inventory-api:8080
      DownstreamServices__Payment__Address: http://st-ms-payment-api:8080
      Cors__AllowedOrigins__0: http://localhost:280
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_SERVICE_NAME: st-gateway
    ports:
      - "${GATEWAY_HOST_PORT:-25000}:8080"
    volumes:
      - gateway-logs:/app/logs
    networks:
      - st-network
    depends_on:
      - st-ms-identity-api
      - st-ms-operationlog-api
      - st-ms-fileupload-api
      - st-ms-test-api
      - st-ms-order-api
      - st-ms-inventory-api
      - st-ms-payment-api
    restart: unless-stopped

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────
  st-web:
    image: ghcr.io/zyxgit/st/st-web:latest
    ports:
      - "${WEB_HOST_PORT:-280}:80"
    networks:
      - st-network
    restart: unless-stopped


networks:
  st-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  identity-logs:
  operationlog-logs:
  operationlog-consumer-logs:
  fileupload-logs:
  fileupload-uploads:
  test-logs:
  order-logs:
  inventory-logs:
  payment-logs:
  gateway-logs:
  loki-data:
  prometheus-data:
  grafana-data:

# ──────────────────────────────────────────────────────────────
# Nginx 反向代理配置 — HTTPS + SSL 终止
#
# 功能：
#   - HTTP (80) → HTTPS (443) 自动重定向
#   - SSL/TLS 终止
#   - 前端静态资源代理
#   - 后端 API 反向代理
#   - 安全头设置
# ──────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # 上传文件大小限制
    client_max_body_size 50m;

    # ──────────────────────────────────────────────
    # HTTP → HTTPS 重定向
    # ──────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt 验证路径
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他请求重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ──────────────────────────────────────────────
    # HTTPS 主配置
    # ──────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书配置
        # 方式1: Let's Encrypt 证书（推荐）
        ssl_certificate /etc/nginx/ssl/live/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/privkey.pem;

        # 方式2: 自签名证书（测试用，取消注释替换上面的配置）
        # ssl_certificate /etc/nginx/ssl/self-signed.crt;
        # ssl_certificate_key /etc/nginx/ssl/self-signed.key;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ──────────────────────────────────────────
        # 前端 (st-web)
        # ──────────────────────────────────────────
        location / {
            proxy_pass http://st-web:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持（如果需要）
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ──────────────────────────────────────────
        # 后端 API (st-gateway)
        # ──────────────────────────────────────────
        location /api/ {
            proxy_pass http://st-gateway:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket 支持
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # ──────────────────────────────────────────
        # 文件上传接口（单独配置，支持大文件）
        # ──────────────────────────────────────────
        location /api/fileupload/ {
            proxy_pass http://st-gateway:8080/FileUpload/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 文件上传限制
            client_max_body_size 100m;

            # 超时配置（上传可能较慢）
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ──────────────────────────────────────────
        # 健康检查端点
        # ──────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # ──────────────────────────────────────────
        # 静态资源缓存
        # ──────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://st-web:80;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }
}

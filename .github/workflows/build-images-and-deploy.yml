name: Build Docker Images And Deploy

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  schedule:
    - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to registry
        type: boolean
        default: true
      tag_override:
        description: Override image tag (defaults to git sha)
        required: false

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Backend microservices
  # ──────────────────────────────────────────────
  build-backend:
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: st-ms-identity-api
            project: Microservices/Identity/ST.MS.Identity.Api/ST.MS.Identity.Api.csproj
          - name: st-ms-operationlog-api
            project: Microservices/OperationLog/ST.MS.OperationLog.Api/ST.MS.OperationLog.Api.csproj
          - name: st-ms-operationlog-consumer
            project: Microservices/OperationLog/ST.MS.OperationLog.Consumer/ST.MS.OperationLog.Consumer.csproj
          - name: st-ms-fileupload-api
            project: Microservices/FileUpload/ST.MS.FileUpload.Api/ST.MS.FileUpload.Api.csproj
          - name: st-ms-test-api
            project: Microservices/Test/ST.MS.Test.Api/ST.MS.Test.Api.csproj
          - name: st-gateway
            project: Microservices/Gateway/ST.Gateway/ST.Gateway.csproj
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Derive DLL name from project filename (e.g. ST.MS.Identity.Api.dll)
      - name: Compute build metadata
        id: meta
        run: |
          PROJECT="${{ matrix.service.project }}"
          DLL=$(basename "$PROJECT" .csproj).dll
          echo "dll=$DLL" >> "$GITHUB_OUTPUT"

      # Date-based sequential tag: 20260522-<run_number>
      - name: Compute date tag
        id: datetag
        run: echo "tag=$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Generate Docker tags: latest, date-seq, branch, semver, short-sha
      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.datetag.outputs.tag }}
            type=raw,value=dev-${{ steps.datetag.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api/src
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            PROJECT=${{ matrix.service.project }}
            DLL=${{ steps.meta.outputs.dll }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────
  build-frontend:
    name: st-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute date tag
        id: datetag
        run: echo "tag=$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/st-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.datetag.outputs.tag }}
            type=raw,value=dev-${{ steps.datetag.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Web
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=http://localhost:25000
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # DB migration (self-hosted runner)
  # ──────────────────────────────────────────────
  migrate-db:
    name: Migrate Databases
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    environment: "ST Secrets"
    permissions:
      contents: read
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK for EF migrations
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dotnet-ef
        shell: pwsh
        run: dotnet new tool-manifest --force 2>$null; dotnet tool install dotnet-ef

      - name: Run EF Core migrations (dedicated job)
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;$env:USERPROFILE\.dotnet\tools"

          $dbHost = "localhost"
          $dbPort = "${{ vars.POSTGRES_HOST_PORT || '25432' }}"
          $dbUser = "${{ secrets.PGUSER }}"
          $dbPassword = "${{ secrets.PGPASSWORD }}"

          $migrations = @(
            @{
              Name = "Identity"
              Project = "Api/src/Microservices/Identity/ST.MS.Identity.Infra/ST.MS.Identity.Infra.csproj"
              Startup = "Api/src/Microservices/Identity/ST.MS.Identity.Api/ST.MS.Identity.Api.csproj"
              DbName = "${{ vars.IDENTITY_DB_NAME || 'st_identity' }}"
            },
            @{
              Name = "OperationLog"
              Project = "Api/src/Microservices/OperationLog/ST.MS.OperationLog.Infra/ST.MS.OperationLog.Infra.csproj"
              Startup = "Api/src/Microservices/OperationLog/ST.MS.OperationLog.Api/ST.MS.OperationLog.Api.csproj"
              DbName = "${{ vars.OPERATIONLOG_DB_NAME || 'st_operationlog' }}"
            },
            @{
              Name = "FileUpload"
              Project = "Api/src/Microservices/FileUpload/ST.MS.FileUpload.Infra/ST.MS.FileUpload.Infra.csproj"
              Startup = "Api/src/Microservices/FileUpload/ST.MS.FileUpload.Api/ST.MS.FileUpload.Api.csproj"
              DbName = "${{ vars.FILEUPLOAD_DB_NAME || 'st_fileupload' }}"
            },
            @{
              Name = "Test"
              Project = "Api/src/Microservices/Test/ST.MS.Test.Infra/ST.MS.Test.Infra.csproj"
              Startup = "Api/src/Microservices/Test/ST.MS.Test.Api/ST.MS.Test.Api.csproj"
              DbName = "${{ vars.TEST_DB_NAME || 'st_test' }}"
            }
          )

          foreach ($m in $migrations) {
            Write-Host "Applying migration for $($m.Name) on DB=$($m.DbName)..."
            $env:Database__ConnectionString = "Host=$dbHost;Port=$dbPort;Username=$dbUser;Password=$dbPassword;Database=$($m.DbName)"
            dotnet ef database update --project $m.Project --startup-project $m.Startup --configuration Release
          }

  # ──────────────────────────────────────────────
  # Deploy to local (self-hosted runner)
  # ──────────────────────────────────────────────
  deploy-local:
    name: Deploy to Local
    needs: [build-backend, build-frontend, migrate-db]
    if: github.ref == 'refs/heads/develop'
    runs-on: self-hosted
    environment: "ST Secrets"
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        shell: pwsh
        run: |
          $services = @(
            "st-web",
            "st-gateway",
            "st-ms-identity-api",
            "st-ms-operationlog-api",
            "st-ms-operationlog-consumer",
            "st-ms-fileupload-api",
            "st-ms-test-api"
          )
          foreach ($svc in $services) {
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/st/${svc}:latest
          }

      - name: Create .env file
        shell: pwsh
        run: |
          @'
          PGUSER=${{ secrets.PGUSER }}
          PGPASSWORD=${{ secrets.PGPASSWORD }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          RABBITUSER=${{ secrets.RABBITUSER }}
          RABBITPASSWORD=${{ secrets.RABBITPASSWORD }}
          JWTSIGNINGKEY=${{ secrets.JWTSIGNINGKEY }}
          SEQ_ADMIN_PASSWORD=${{ secrets.SEQ_ADMIN_PASSWORD }}
          POSTGRES_HOST_PORT=${{ vars.POSTGRES_HOST_PORT || '25432' }}
          REDIS_HOST_PORT=${{ vars.REDIS_HOST_PORT || '26379' }}
          RABBITMQ_AMQP_HOST_PORT=${{ vars.RABBITMQ_AMQP_HOST_PORT || '25672' }}
          RABBITMQ_MGMT_HOST_PORT=${{ vars.RABBITMQ_MGMT_HOST_PORT || '25673' }}
          IDENTITY_HOST_PORT=${{ vars.IDENTITY_HOST_PORT || '27127' }}
          OPERATIONLOG_HOST_PORT=${{ vars.OPERATIONLOG_HOST_PORT || '21001' }}
          FILEUPLOAD_HOST_PORT=${{ vars.FILEUPLOAD_HOST_PORT || '27250' }}
          TEST_HOST_PORT=${{ vars.TEST_HOST_PORT || '25089' }}
          GATEWAY_HOST_PORT=${{ vars.GATEWAY_HOST_PORT || '25000' }}
          WEB_HOST_PORT=${{ vars.WEB_HOST_PORT || '280' }}
          SEQ_HOST_PORT=${{ vars.SEQ_HOST_PORT || '25341' }}
          '@ | Out-File -FilePath deploy/.env -Encoding utf8

      - name: Restart containers
        run: |
          docker compose -p st -f deploy/docker-compose.yml --env-file deploy/.env down
          docker compose -p st -f deploy/docker-compose.yml --env-file deploy/.env up -d
          docker image prune -f

  # ══════════════════════════════════════════════
  # Cleanup old dev images  ← 新增 job
  # ══════════════════════════════════════════════
  cleanup:
    name: Cleanup old dev images
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
      packages: write       # needed for DELETE versions
    env:
      KEEP_COUNT: 10
      # 与 build-backend matrix.service.name + st-web 保持一致
      SERVICES: '["st-ms-identity-api","st-ms-operationlog-api","st-ms-operationlog-consumer","st-ms-fileupload-api","st-ms-test-api","st-gateway","st-web"]'
      # 改为 true 则只打印不删除（可在 workflow_dispatch 时手动调整）
      DRY_RUN: false
    steps:
      - name: Cleanup dev-tagged images per service
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=${{ env.KEEP_COUNT }}
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          for SERVICE in $(echo '${{ env.SERVICES }}' | jq -r '.[]'); do
            echo "╔══════════════════════════════════════════"
            echo "║ Processing: ${SERVICE}"
            echo "╚══════════════════════════════════════════"

            # ── 获取所有版本（含标签），按创建时间降序 ──
            VERSIONS=$(gh api \
              "/repos/${OWNER}/${REPO}/packages/container/${SERVICE}/versions" \
              --jq '[.[] | select(.metadata.container.tags | length > 0) |
                {id: .id, tags: .metadata.container.tags, created_at: .created_at}] |
                sort_by(.created_at) | reverse' 2>/dev/null) || {
              echo "  [SKIP] 无法获取版本信息（包可能不存在）"
              continue
            }

            # ── 仅保留含 "dev-" 标签的版本 ──
            DEV_VERSIONS=$(echo "$VERSIONS" | jq '[.[] | select(.tags[] | startswith("dev-"))]')
            TOTAL=$(echo "$DEV_VERSIONS" | jq 'length')
            echo "  dev-* 版本数: ${TOTAL}"

            if [ "$TOTAL" -le "$KEEP" ]; then
              echo "  无需清理 (${TOTAL} ≤ ${KEEP})"
              continue
            fi

            # ── 超出保留数的旧版本 ──
            TO_DELETE=$(echo "$DEV_VERSIONS" | jq ".[${KEEP}:][]")
            DELETE_COUNT=$(echo "$TO_DELETE" | jq -s 'length')
            echo "  待删除版本: ${DELETE_COUNT}"

            echo "$TO_DELETE" | jq -c '.' | while read -r ITEM; do
              VID=$(echo "$ITEM" | jq -r '.id')
              TAGS=$(echo "$ITEM" | jq -r '.tags | join(", ")')
              echo "  [DELETE] ID=${VID}  tags=[${TAGS}]"

              if [ "${{ env.DRY_RUN }}" = "true" ]; then
                echo "  [DRY-RUN] 跳过实际删除"
              else
                gh api -X DELETE \
                  "/repos/${OWNER}/${REPO}/packages/container/${SERVICE}/versions/${VID}" \
                  --silent && echo "  [OK] 已删除" || echo "  [WARN] 删除失败"
              fi
            done
          done

name: Build Docker Images

on:
  # push:
  #   branches: [develop]
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**.md'
  # schedule:
  #   - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to registry
        type: boolean
        default: true
      tag_override:
        description: Override image tag (defaults to git sha)
        required: false
      vite_api_base_url:
        description: Frontend API base URL (leave empty to use nginx proxy)
        required: false
        default: ''
      dry_run:
        description: Dry-run mode for cleanup (print only, no delete)
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

concurrency:
  group: build-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Backend microservices
  # ──────────────────────────────────────────────
  build-backend:
    if: github.event_name != 'schedule'
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: st-ms-identity-api
            project: Microservices/Identity/ST.MS.Identity.Api/ST.MS.Identity.Api.csproj
          - name: st-ms-operationlog-api
            project: Microservices/OperationLog/ST.MS.OperationLog.Api/ST.MS.OperationLog.Api.csproj
          - name: st-ms-operationlog-consumer
            project: Microservices/OperationLog/ST.MS.OperationLog.Consumer/ST.MS.OperationLog.Consumer.csproj
          - name: st-ms-fileupload-api
            project: Microservices/FileUpload/ST.MS.FileUpload.Api/ST.MS.FileUpload.Api.csproj
          - name: st-ms-test-api
            project: Microservices/Test/ST.MS.Test.Api/ST.MS.Test.Api.csproj
          - name: st-ms-order-api
            project: Microservices/Order/ST.MS.Order.Api/ST.MS.Order.Api.csproj
          - name: st-ms-inventory-api
            project: Microservices/Inventory/ST.MS.Inventory.Api/ST.MS.Inventory.Api.csproj
          - name: st-ms-payment-api
            project: Microservices/Payment/ST.MS.Payment.Api/ST.MS.Payment.Api.csproj
          - name: st-gateway
            project: Microservices/Gateway/ST.Gateway/ST.Gateway.csproj
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Derive DLL name from project filename (e.g. ST.MS.Identity.Api.dll)
      - name: Compute build metadata
        id: meta
        run: |
          PROJECT="${{ matrix.service.project }}"
          DLL=$(basename "$PROJECT" .csproj).dll
          echo "dll=$DLL" >> "$GITHUB_OUTPUT"

      # Date-based sequential tag: 20260522-<run_number>
      - name: Compute date tag
        id: datetag
        run: echo "tag=$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # Generate Docker tags: latest, date-seq, branch, semver, short-sha
      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.datetag.outputs.tag }}
            type=raw,value=dev-${{ steps.datetag.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api/src
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            PROJECT=${{ matrix.service.project }}
            DLL=${{ steps.meta.outputs.dll }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────
  build-frontend:
    if: github.event_name != 'schedule'
    name: st-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute date tag
        id: datetag
        run: echo "tag=$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/st-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=${{ steps.datetag.outputs.tag }}
            type=raw,value=dev-${{ steps.datetag.outputs.tag }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Web
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || inputs.vite_api_base_url || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Backend tests (quality gate)
  # ──────────────────────────────────────────────
  test-backend:
    name: Test Backend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Run tests (if any exist)
        run: |
          TEST_PROJECTS=$(find Api/src -maxdepth 3 -name '*.csproj' -exec grep -l 'Microsoft.NET.Test.Sdk\|NUnit\|xunit' {} \; 2>/dev/null || true)
          if [ -n "$TEST_PROJECTS" ]; then
            dotnet test Api/src/ST.slnx --configuration Release --verbosity normal
          else
            echo "No test projects found, skipping test phase"
          fi



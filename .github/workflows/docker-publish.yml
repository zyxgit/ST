# =============================================================================
# 构建并推送 Docker 镜像到 GitHub Container Registry (GHCR)
# 触发方式：push main 或手动 workflow_dispatch
# 构建方式：使用 .NET 10 SDK 内置容器发布（无需 Dockerfile）
# =============================================================================
name: Build and Push Docker Images

on:
  # push main 时自动触发，仅排除 .md 文件变更
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  # 支持 GitHub 页面手动触发，可选自定义 tag 后缀
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: Custom tag suffix (e.g. rc1)
        required: false
        default: ''

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # 6 个微服务并行构建互不影响
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: gateway
            project: Api/src/Microservices/Gateway/ST.Gateway/ST.Gateway.csproj
          - name: identity-api
            project: Api/src/Microservices/Identity/ST.MS.Identity.Api/ST.MS.Identity.Api.csproj
          - name: operationlog-api
            project: Api/src/Microservices/OperationLog/ST.MS.OperationLog.Api/ST.MS.OperationLog.Api.csproj
          - name: operationlog-consumer
            project: Api/src/Microservices/OperationLog/ST.MS.OperationLog.Consumer/ST.MS.OperationLog.Consumer.csproj
          - name: fileupload-api
            project: Api/src/Microservices/FileUpload/ST.MS.FileUpload.Api/ST.MS.FileUpload.Api.csproj
          - name: test-api
            project: Api/src/Microservices/Test/ST.MS.Test.Api/ST.MS.Test.Api.csproj

    runs-on: ubuntu-latest

    steps:
      # 拉取仓库代码
      - uses: actions/checkout@v4

      # 安装 .NET 10 SDK（包含内置容器发布能力）
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 缓存 NuGet 包，加速后续构建
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Api/src/**/packages.lock.json', 'Api/src/nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 登录 GHCR，使用 GITHUB_TOKEN（自动有当前仓库的 packages 读写权限）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 用 dotnet publish 构建 + 推送容器镜像
      # 镜像标签格式：{run_number}-{run_attempt}-{sha_prefix}，如 3-1-a1b2c3d
      - name: Build and push container
        shell: bash
        env:
          CUSTOM_TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          TAG="${{ github.run_number }}-${{ github.run_attempt }}${CUSTOM_TAG_SUFFIX:+-$CUSTOM_TAG_SUFFIX}"
          SHA_TAG="${{ github.sha }}"
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          dotnet publish "${{ matrix.service.project }}" \
            -c Release \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            -p:ContainerRepository="${REPO_LC}/${{ matrix.service.name }}" \
            -p:ContainerImageTag="${TAG}-${SHA_TAG}" \
            --os linux --arch x64

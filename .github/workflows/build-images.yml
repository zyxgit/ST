name: Build Docker Images

on:
  # push:
  #   branches: [main]
  #   paths-ignore:
  #     - 'docs/**'
  #     - '**.md'
  # schedule:
  #   - cron: '0 6 * * *'    # daily at 06:00 UTC
  workflow_dispatch:
    inputs:
      push_images:
        description: Push images to registry
        type: boolean
        default: true
      tag_override:
        description: Override image tag (defaults to git sha)
        required: false
      vite_api_base_url:
        description: Frontend API base URL (leave empty to use nginx proxy)
        required: false
        default: ''
      dry_run:
        description: Dry-run mode for cleanup (print only, no delete)
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────────
  # Backend microservices (parallel)
  # ──────────────────────────────────────────────
  build-backend:
    if: github.event_name != 'schedule'
    name: ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: st-ms-identity-api
            project: Microservices/Identity/ST.MS.Identity.Api/ST.MS.Identity.Api.csproj
          - name: st-ms-operationlog-api
            project: Microservices/OperationLog/ST.MS.OperationLog.Api/ST.MS.OperationLog.Api.csproj
          - name: st-ms-operationlog-consumer
            project: Microservices/OperationLog/ST.MS.OperationLog.Consumer/ST.MS.OperationLog.Consumer.csproj
          - name: st-ms-fileupload-api
            project: Microservices/FileUpload/ST.MS.FileUpload.Api/ST.MS.FileUpload.Api.csproj
          - name: st-ms-test-api
            project: Microservices/Test/ST.MS.Test.Api/ST.MS.Test.Api.csproj
          - name: st-ms-order-api
            project: Microservices/Order/ST.MS.Order.Api/ST.MS.Order.Api.csproj
          - name: st-ms-inventory-api
            project: Microservices/Inventory/ST.MS.Inventory.Api/ST.MS.Inventory.Api.csproj
          - name: st-ms-payment-api
            project: Microservices/Payment/ST.MS.Payment.Api/ST.MS.Payment.Api.csproj
          - name: st-gateway
            project: Microservices/Gateway/ST.Gateway/ST.Gateway.csproj
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute build metadata
        id: meta
        run: |
          PROJECT="${{ matrix.service.project }}"
          DLL=$(basename "$PROJECT" .csproj).dll
          echo "dll=$DLL" >> "$GITHUB_OUTPUT"

      - name: Compute date tag
        id: datetag
        run: echo "tag=$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.datetag.outputs.tag }}
            type=raw,value=dev-${{ steps.datetag.outputs.tag }}
            type=ref,event=branch
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Api/src
          push: ${{ inputs.push_images != false }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            PROJECT=${{ matrix.service.project }}
            DLL=${{ steps.meta.outputs.dll }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────
  build-frontend:
    if: github.event_name != 'schedule'
    name: st-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Compute date tag
        id: datetag
        run: echo "tag=$(date +'%Y%m%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/st-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.datetag.outputs.tag }}
            type=raw,value=dev-${{ steps.datetag.outputs.tag }}
            type=ref,event=branch
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Web
          push: ${{ inputs.push_images != false }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || inputs.vite_api_base_url || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════
  # Cleanup old dev images
  # ══════════════════════════════════════════════
  cleanup:
    name: Cleanup old dev images
    runs-on: ubuntu-latest
    if: always()
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: write
    env:
      KEEP_COUNT: 4
      SERVICES: '["st-ms-identity-api","st-ms-operationlog-api","st-ms-operationlog-consumer","st-ms-fileupload-api","st-ms-test-api","st-ms-order-api","st-ms-inventory-api","st-ms-payment-api","st-gateway","st-web"]'
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Cleanup dev-tagged images per service
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=${{ env.KEEP_COUNT }}
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          for SERVICE in $(echo '${{ env.SERVICES }}' | jq -r '.[]'); do
            echo "╔══════════════════════════════════════════"
            echo "║ Processing: ${SERVICE}"
            echo "╚══════════════════════════════════════════"

            # ── 获取所有版本（含标签），按创建时间降序 ──
            VERSIONS=$(gh api \
              "/repos/${OWNER}/${REPO}/packages/container/${SERVICE}/versions" \
              --jq '[.[] | select(.metadata.container.tags | length > 0) |
                {id: .id, tags: .metadata.container.tags, created_at: .created_at}] |
                sort_by(.created_at) | reverse' 2>/dev/null) || {
              echo "  [SKIP] 无法获取版本信息（包可能不存在）"
              continue
            }

            # ── 仅保留含 "dev-" 标签的版本 ──
            DEV_VERSIONS=$(echo "$VERSIONS" | jq '[.[] | select(.tags[] | startswith("dev-"))]')
            TOTAL=$(echo "$DEV_VERSIONS" | jq 'length')
            echo "  dev-* 版本数: ${TOTAL}"

            if [ "$TOTAL" -le "$KEEP" ]; then
              echo "  无需清理 (${TOTAL} ≤ ${KEEP})"
              continue
            fi

            # ── 超出保留数的旧版本 ──
            TO_DELETE=$(echo "$DEV_VERSIONS" | jq ".[${KEEP}:][]")
            DELETE_COUNT=$(echo "$TO_DELETE" | jq -s 'length')
            echo "  待删除版本: ${DELETE_COUNT}"

            echo "$TO_DELETE" | jq -c '.' | while read -r ITEM; do
              VID=$(echo "$ITEM" | jq -r '.id')
              TAGS=$(echo "$ITEM" | jq -r '.tags | join(", ")')
              echo "  [DELETE] ID=${VID}  tags=[${TAGS}]"

              if [ "${{ env.DRY_RUN }}" = "true" ]; then
                echo "  [DRY-RUN] 跳过实际删除"
              else
                gh api -X DELETE \
                  "/repos/${OWNER}/${REPO}/packages/container/${SERVICE}/versions/${VID}" \
                  --silent && echo "  [OK] 已删除" || echo "  [WARN] 删除失败"
              fi
            done
          done
